name: Refresh Sixth Street local lockfile

on:
  push:
    branches:
      - sixth-street-creative
    paths:
      - '.github/workflows/refresh-sixth-local-lock.yml'

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: sixth-street-creative
      - name: Generate standalone lockfile
        shell: bash
        run: |
          set -euo pipefail
          corepack enable
          corepack prepare pnpm@10.11.1 --activate
          cd artifacts/sixth-street-creative
          pnpm install --lockfile-only --no-frozen-lockfile
      - name: Commit local lockfile
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/refresh-sixth-local-lock.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add artifacts/sixth-street-creative/pnpm-lock.yaml .github/workflows/refresh-sixth-local-lock.yml
          git commit -m 'Add standalone Sixth Street pnpm lockfile'
          git push origin HEAD:sixth-street-creative
