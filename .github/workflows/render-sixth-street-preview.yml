name: Render Sixth Street Creative Preview

on:
  push:
    branches:
      - sixth-street-creative
    paths:
      - '.github/workflows/render-sixth-street-preview.yml'

permissions:
  contents: write

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: sixth-street-creative
          fetch-depth: 1

      - name: Install and build
        shell: bash
        run: |
          set -euo pipefail
          corepack enable
          pnpm install --frozen-lockfile
          pnpm --filter @workspace/sixth-street-creative build

      - name: Start preview server
        shell: bash
        run: |
          nohup pnpm --filter @workspace/sixth-street-creative exec vite preview --host 127.0.0.1 --port 4173 >/tmp/ssc-vite.log 2>&1 &
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:4173/ >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/ssc-vite.log
          exit 1

      - name: Capture homepage
        shell: bash
        run: |
          set -euo pipefail
          OUT="$GITHUB_WORKSPACE/artifacts/sixth-street-creative/preview/homepage.png"
          mkdir -p "$(dirname "$OUT")"
          CHROME="$(command -v google-chrome || command -v chromium || command -v chromium-browser)"
          TMP="$(mktemp -d)"
          cd "$TMP"
          npm init -y >/dev/null 2>&1
          npm install --silent puppeteer-core
          export CHROME OUT
          cat > capture.cjs <<'NODE'
          const puppeteer = require('puppeteer-core');
          (async () => {
            const browser = await puppeteer.launch({
              executablePath: process.env.CHROME,
              headless: true,
              args: ['--no-sandbox', '--disable-dev-shm-usage'],
            });
            const page = await browser.newPage();
            await page.setViewport({ width: 1440, height: 1000, deviceScaleFactor: 1 });
            await page.goto('http://127.0.0.1:4173/', { waitUntil: 'networkidle0', timeout: 60000 });
            await page.screenshot({ path: process.env.OUT, fullPage: true });
            await browser.close();
          })().catch((error) => { console.error(error); process.exit(1); });
          NODE
          node capture.cjs
          file "$OUT"

      - name: Commit preview and remove renderer
        shell: bash
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE"
          rm -f .github/workflows/render-sixth-street-preview.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add artifacts/sixth-street-creative/preview/homepage.png .github/workflows/render-sixth-street-preview.yml
          git commit -m 'Render Sixth Street Creative homepage preview'
          git push origin HEAD:sixth-street-creative
