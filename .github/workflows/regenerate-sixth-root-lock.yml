name: Regenerate Sixth Street root lockfile

on:
  push:
    branches:
      - sixth-street-creative
    paths:
      - '.github/workflows/regenerate-sixth-root-lock.yml'

permissions:
  contents: write

jobs:
  regenerate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: sixth-street-creative
      - name: Regenerate slim root lockfile
        run: |
          corepack enable
          corepack prepare pnpm@10.11.1 --activate
          pnpm install --lockfile-only --no-frozen-lockfile
      - name: Commit lockfile
        run: |
          rm -f .github/workflows/regenerate-sixth-root-lock.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add pnpm-lock.yaml .github/workflows/regenerate-sixth-root-lock.yml
          git commit -m 'Regenerate slim Sixth Street root lockfile'
          git push origin HEAD:sixth-street-creative
