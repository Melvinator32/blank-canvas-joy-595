name: Apply Sixth Street About Update

on:
  push:
    branches: [sixth-street-creative]
    paths: ['.github/workflows/apply-sixth-about.yml']

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: sixth-street-creative
      - run: python3 scripts/update-sixth-street-about.py
      - run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          rm -f .github/workflows/apply-sixth-about.yml scripts/update-sixth-street-about.py
          git add artifacts/sixth-street-creative/src/App.tsx .github/workflows/apply-sixth-about.yml scripts/update-sixth-street-about.py
          git commit -m 'Move Creative Journey to About Me page'
          git push origin HEAD:sixth-street-creative
