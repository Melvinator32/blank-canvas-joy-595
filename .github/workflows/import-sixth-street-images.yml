          download 'https://lh7-us.googleusercontent.com/sitesv-images-rt/AMxu72vDLUjVz1Ccyhdt9ViiajBYW2hDYS7uvXcY01uunQkBRBFAgJArUnPpjWmsWIJ2K5UfvHBbPeLUVq_8Qd06QhYJSiF52Kow6Vs82gRxn_Y4CBRMEHu_d2S-iHa4vIDnLzUFqAOYaOiboxk4s58CkOSrCGOu_ssdkLtZHd17XNKi4avD1c1LlIl1iC9HasK0H5c6gGABgIeMeRfMWjX6nlGmbgj-F46sYSqr9SOP9vU=w1280' "$ROOT/portfolio/commercial-04.jpg"

          file "$ROOT"/hero.jpg "$ROOT"/portfolio/*.jpg

      - name: Commit copied images
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add artifacts/sixth-street-creative/public/images
          if git diff --cached --quiet; then
            echo 'No image changes to commit.'
            exit 0
          fi
          git commit -m 'Copy images from existing Sixth Street Creative site'
          git push origin HEAD:sixth-street-creative
