name: Finalize Sixth Street Creative image import

on:
  push:
    branches:
      - sixth-street-creative
    paths:
      - '.github/workflows/import-sixth-street-images.yml'

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: sixth-street-creative

      - name: Point site at local image copies
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          app = Path('artifacts/sixth-street-creative/src/App.tsx')
          text = app.read_text()
          local_paths = [
              '/images/hero.jpg',
              '/images/portfolio/residential-01.jpg',
              '/images/portfolio/residential-02.jpg',
              '/images/portfolio/residential-03.jpg',
              '/images/portfolio/residential-04.jpg',
              '/images/portfolio/hospitality-01.jpg',
              '/images/portfolio/hospitality-02.jpg',
              '/images/portfolio/hospitality-03.jpg',
              '/images/portfolio/hospitality-04.jpg',
              '/images/portfolio/commercial-01.jpg',
              '/images/portfolio/commercial-02.jpg',
              '/images/portfolio/commercial-03.jpg',
              '/images/portfolio/commercial-04.jpg',
          ]
          pattern = re.compile(r'https://lh7-us\.googleusercontent\.com/[^\'"\s]+')
          matches = pattern.findall(text)
          if len(matches) != len(local_paths):
              raise SystemExit(f'Expected {len(local_paths)} Google image references in App.tsx; found {len(matches)}')
          for old, new in zip(matches, local_paths):
              text = text.replace(old, new, 1)
          if 'googleusercontent.com' in text:
              raise SystemExit('External Google image reference remains in App.tsx')
          app.write_text(text)
          PY

      - name: Remove one-time importer and commit
        shell: bash
        run: |
          rm .github/workflows/import-sixth-street-images.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add artifacts/sixth-street-creative/src/App.tsx .github/workflows/import-sixth-street-images.yml
          git commit -m 'Use local Sixth Street Creative image assets'
          git push origin HEAD:sixth-street-creative
