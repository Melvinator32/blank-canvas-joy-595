name: Import Sixth Street Creative images

on:
  push:
    branches:
      - sixth-street-creative
    paths:
      - '.github/workflows/import-sixth-street-images.yml'

permissions:
  contents: write

jobs:
  import-images:
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: sixth-street-creative

      - name: Download images from current site
        shell: bash
        run: |
          set -euo pipefail
          ROOT="artifacts/sixth-street-creative/public/images"
          mkdir -p "$ROOT/portfolio"

          download() {
            local url="$1"
            local out="$2"
            curl -L --fail --retry 3 --retry-delay 2 \
              -A 'Mozilla/5.0' \
              -H 'Accept: image/avif,image/webp,image/apng,image/svg+xml,image/*,*/*;q=0.8' \
              "$url" -o "$out"
            test -s "$out"
          }

