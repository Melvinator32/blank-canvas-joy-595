name: Refresh Sixth Street lockfile

on:
  push:
    branches:
      - sixth-street-creative
    paths:
      - '.github/workflows/refresh-sixth-lock.yml'

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: sixth-street-creative
      - name: Regenerate lockfile with Cloudflare pnpm version
        shell: bash
        run: |
          set -euo pipefail
          corepack enable
          corepack prepare pnpm@10.11.1 --activate
          pnpm install --lockfile-only --no-frozen-lockfile
      - name: Commit lockfile
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/refresh-sixth-lock.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add pnpm-lock.yaml .github/workflows/refresh-sixth-lock.yml
          git commit -m 'Refresh lockfile for Sixth Street Cloudflare deploy'
          git push origin HEAD:sixth-street-creative
