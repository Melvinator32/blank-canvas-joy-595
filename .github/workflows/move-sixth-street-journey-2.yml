name: Apply Sixth Street About page update

on:
  push:
    branches:
      - sixth-street-creative
    paths:
      - '.github/workflows/move-sixth-street-journey-2.yml'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: sixth-street-creative
      - name: Move Creative Journey
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('artifacts/sixth-street-creative/src/App.tsx')
          text = path.read_text()
          text = text.replace("type Page = 'home' | 'portfolio';", "type Page = 'home' | 'about' | 'portfolio';")
          text = text.replace("description: 'An early design practice rooted in the belief that art should feel personal, lived-in, and inseparable from the spaces around it.',", "description: 'A jewelry design business where Rowanne first developed her eye for materials, composition, craftsmanship, and creating pieces with a distinct point of view.',")
          text = text.replace("const getPage = (): Page => (window.location.hash === '#/portfolio' ? 'portfolio' : 'home');", "const getPage = (): Page => {\n    if (window.location.hash === '#/portfolio') return 'portfolio';\n    if (window.location.hash === '#/about') return 'about';\n    return 'home';\n  };")
          text = text.replace("        <a className={page === 'portfolio' ? 'active' : ''} href=\"#/portfolio\">Portfolio</a>\n        <a href=\"#mediums\">Mediums</a>", "        <a className={page === 'about' ? 'active' : ''} href=\"#/about\">About Me</a>\n        <a className={page === 'portfolio' ? 'active' : ''} href=\"#/portfolio\">Portfolio</a>\n        <a href=\"#mediums\">Mediums</a>")
          journey_block = '''        <section className="journey shell-section" id="journey">
          <div className="section-heading-row">
            <div>
              <div className="eyebrow">Creative Journey</div>
              <h2>Three chapters.<br />One point of view.</h2>
            </div>
            <p className="section-intro">Sixth Street Creative is the latest expression of a creative practice shaped over time by design, artists, and the relationships between them.</p>
          </div>

          <div className="journey-list">
            {journey.map((item) => (
              <article className="journey-item" key={item.name}>
                <div className="journey-number">{item.number}</div>
                <div>
                  <div className="journey-label">{item.label}</div>
                  <h3>{item.name}</h3>
                </div>
                <p>{item.description}</p>
              </article>
            ))}
          </div>
        </section>

'''
          if journey_block not in text: raise SystemExit('journey block not found')
          text = text.replace(journey_block, '', 1)
          about = '''function AboutPage() {
  return (
    <>
      <main>
        <section className="portfolio-hero shell-section about-hero">
          <div className="eyebrow">About Me</div>
          <div className="portfolio-title-row">
            <h1>A creative practice<br /><em>built over time.</em></h1>
            <p>Sixth Street Creative grew from Rowanne's path through jewelry design, artist relationships, curation, and a lasting belief that art should make a space feel more personal.</p>
          </div>
        </section>

        <section className="journey shell-section" id="journey">
          <div className="section-heading-row">
            <div>
              <div className="eyebrow">Creative Journey</div>
              <h2>Three chapters.<br />One point of view.</h2>
            </div>
            <p className="section-intro">The studio today is shaped by years of making, curating, connecting artists with clients, and building creative relationships.</p>
          </div>
          <div className="journey-list">
            {journey.map((item) => (
              <article className="journey-item" key={item.name}>
                <div className="journey-number">{item.number}</div>
                <div><div className="journey-label">{item.label}</div><h3>{item.name}</h3></div>
                <p>{item.description}</p>
              </article>
            ))}
          </div>
        </section>
      </main>
      <Footer />
    </>
  );
}

'''
          text = text.replace('function PortfolioPage() {', about + 'function PortfolioPage() {', 1)
          old = '''      {page === 'portfolio' ? (
        <PortfolioPage />
      ) : (
        <HomePage
          artistGroups={isEditing ? draftArtistGroups : savedArtistGroups}
          isEditing={isEditing}
          onArtistGroupsChange={setDraftArtistGroups}
        />
      )}'''
          new = '''      {page === 'portfolio' ? (
        <PortfolioPage />
      ) : page === 'about' ? (
        <AboutPage />
      ) : (
        <HomePage
          artistGroups={isEditing ? draftArtistGroups : savedArtistGroups}
          isEditing={isEditing}
          onArtistGroupsChange={setDraftArtistGroups}
        />
      )}'''
          if old not in text: raise SystemExit('route block not found')
          path.write_text(text.replace(old, new, 1))
          PY
      - name: Commit
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add artifacts/sixth-street-creative/src/App.tsx
          git commit -m 'Move Creative Journey to About Me page'
          git push origin HEAD:sixth-street-creative
